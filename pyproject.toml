[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-demos"
version = "0.1.0"
description = "Working, tested demos: Arabic branded PDF reports, competitor price monitoring, Arabic/English library search, rental accounts workbook"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Naufal Kausar" }]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "starlette",
    "anyio>=4",
    "uvicorn>=0.29",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    "Pillow>=10",
    "numpy>=1.26",
    "pandas>=2",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
llm = ["anthropic>=0.120"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
arabic-report = "arabic_report.cli:main"
price-monitor = "price_monitor.cli:main"
library-search = "library_search.cli:main"
fleet-accounts = "fleet_accounts.cli:main"

[tool.setuptools]
packages = ["arabic_report", "price_monitor", "library_search", "fleet_accounts", "scrape_kit", "llm_extract"]

[tool.setuptools.package-data]
library_search = ["page.html", "synonyms.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
